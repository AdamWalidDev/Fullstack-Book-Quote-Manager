<header class="app-nav">
  <div class="container nav-inner">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a2.5 2.5 0 0 1 0-5H20"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M9.2 6.5h1.3a1 1 0 0 1 1 1v1.6c0 1.4-.8 2.6-2.1 3.3a.45.45 0 0 1-.6-.55c.4-.65.65-1.2.7-1.85h-.3a1 1 0 0 1-1-1v-1.5a1 1 0 0 1 1-1Zm4.3 0h1.3a1 1 0 0 1 1 1v1.6c0 1.4-.8 2.6-2.1 3.3a.45.45 0 0 1-.6-.55c.4-.65.65-1.2.7-1.85h-.3a1 1 0 0 1-1-1v-1.5a1 1 0 0 1 1-1Z"
            fill="var(--brand-accent)"
          />
        </svg>
      </span>
      <span>{{ title() }}</span>
    </a>

    @if (auth.isLoggedIn() && !isAuthRoute) {
      <nav class="nav-links" [class.open]="navOpen">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="navOpen = false">
          <i class="fas fa-book"></i>Library
        </a>
        <a routerLink="/my-citations" routerLinkActive="active" (click)="navOpen = false">
          <i class="fas fa-quote-left"></i>My Quotes
        </a>
      </nav>
    }

    <div class="nav-actions">
      <button
        class="icon-btn theme-toggle"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <i class="fas" [class.fa-sun]="themeService.theme() === 'dark'" [class.fa-moon]="themeService.theme() === 'light'"></i>
      </button>

      @if (auth.isLoggedIn() && !isAuthRoute) {
        <button class="btn btn-sm btn-ghost d-none d-md-inline-flex align-items-center" (click)="auth.logout()">
          <i class="fas fa-arrow-right-from-bracket me-2"></i>Sign out
        </button>
        <button class="icon-btn d-md-none" (click)="navOpen = !navOpen" aria-label="Toggle navigation">
          <i class="fas" [class.fa-bars]="!navOpen" [class.fa-xmark]="navOpen"></i>
        </button>
      } @else if (!isAuthRoute) {
        <a routerLink="/login" class="btn btn-sm btn-ghost">Sign in</a>
        <a routerLink="/register" class="btn btn-sm btn-primary">Get started</a>
      }
    </div>
  </div>
</header>

<main class="container app-main" [class.auth-main-layout]="isAuthRoute">
  <router-outlet />
</main>

<footer class="container app-footer" [class.auth-footer]="isAuthRoute">
  <span>© {{ year }} Quotebook · Built with .NET 9 &amp; Angular 20</span>
  <span class="d-flex gap-3">
    @if (auth.isLoggedIn() && !isAuthRoute) {
      <a href="#" class="d-md-none" (click)="$event.preventDefault(); auth.logout()">Sign out</a>
    }
    <a href="https://github.com/AdamWalidDev/Fullstack-Book-Quote-Manager" target="_blank" rel="noopener">
      <i class="fab fa-github me-1"></i>Source code
    </a>
  </span>
</footer>
