<app-auth-shell>
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-subtitle">Sign in to your Quotebook account to manage your library and notes.</p>

  <button type="button" class="demo-button" [disabled]="loading()" (click)="loginAsDemo()">
    <i class="fas fa-bolt" aria-hidden="true"></i>Try the demo
  </button>
  <p class="demo-hint">No sign-up needed · First request may take ~30s while the free API wakes up</p>

  @if (error()) {
    <div class="alert alert-danger app-alert">
      <i class="fas fa-circle-exclamation"></i>{{ error() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="username" class="auth-label">Username</label>
      <input type="text" id="username" class="auth-input" [(ngModel)]="username" name="username" autocomplete="username" required />
    </div>

    <div class="mb-4">
      <label for="password" class="auth-label">Password</label>
      <input type="password" id="password" class="auth-input" [(ngModel)]="password" name="password" autocomplete="current-password" required />
    </div>

    <button type="submit" class="auth-submit" [disabled]="loading() || !username || !password">
      @if (loading()) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      Sign in
    </button>
  </form>

  <p class="auth-switch">Don't have an account? <a routerLink="/register">Create one</a></p>
</app-auth-shell>
