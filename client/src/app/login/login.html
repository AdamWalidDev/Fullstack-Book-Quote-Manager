<app-auth-shell>
  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to your Quotebook account.</p>

  @if (error()) {
    <div class="alert alert-danger app-alert">
      <i class="fas fa-circle-exclamation"></i>{{ error() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" id="username" class="form-control" [(ngModel)]="username" name="username" autocomplete="username" required />
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" autocomplete="current-password" required />
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="loading() || !username || !password">
      @if (loading()) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      Sign in
    </button>
  </form>

  <div class="divider">or</div>

  <button type="button" class="btn btn-outline-secondary w-100" [disabled]="loading()" (click)="loginAsDemo()">
    <i class="fas fa-bolt me-2" style="color: var(--accent)"></i>Try the demo
  </button>
  <p class="hint">No sign-up needed. The first request may take ~30s while the free server wakes up.</p>

  <p class="auth-switch">Don't have an account? <a routerLink="/register">Create one</a></p>
</app-auth-shell>
