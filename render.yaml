services:
  - type: web
    # Existing service identity; retained to preserve the current deployment.
    name: redrivertest-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: Jwt__SigningKey
        sync: false  # you'll set this manually in the Render dashboard
      - key: Jwt__Issuer
        value: Quotebook
      - key: Jwt__Audience
        value: Quotebook
      - key: Jwt__ExpirationMinutes
        value: "60"
      - key: AllowedOrigins__0
        value: https://bok-citathantering.vercel.app
